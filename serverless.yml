service: lambda-gurumi-bot
frameworkVersion: "3"

provider:
  name: aws
  runtime: python3.12
  # Keep arch aligned with the GitHub Actions Ubuntu runner so pip installs
  # wheels that match the Lambda runtime (pydantic_core, etc.). Switching
  # back to arm64 needs a Docker-based build (serverless-python-requirements
  # dockerizePip) or a cross-platform wheel flag — deferred.
  architecture: x86_64
  region: ${env:AWS_REGION, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  memorySize: 5120
  timeout: 300
  stackTags:
    katalog_id: "858"
  tags:
    katalog_id: "858"
  environment:
    # --- runtime-internal (serverless-provided, not from CI env) ---
    # NOTE: AWS_REGION is auto-injected by the Lambda runtime and is a
    # reserved name we can't override here — src/config.py reads it directly
    # via os.getenv("AWS_REGION", ...). Do not add an AWS_REGION_NAME alias
    # here; no code reads it.
    DYNAMODB_TABLE_NAME: ${self:service}-${sls:stage}
    # --- multi-tenant Slack credentials (per-app, fetched at request time) ---
    # Each Slack app's signing_secret + bot_token live as SecureString
    # parameters in SSM at {SSM_PARAMS_PREFIX}/{api_app_id}/signing_secret
    # and {SSM_PARAMS_PREFIX}/{api_app_id}/bot_token. Operator provisions
    # these via `aws ssm put-parameter` (or Terraform / CDK) before the
    # corresponding Slack app sends events. NO global SLACK_BOT_TOKEN /
    # SLACK_SIGNING_SECRET env vars — the lookup is per request, keyed on
    # the api_app_id parsed from the inbound payload.
    SSM_PARAMS_PREFIX: ${env:SSM_PARAMS_PREFIX, '/gurumi-bot/apps'}
    SSM_CACHE_TTL_SECONDS: ${env:SSM_CACHE_TTL_SECONDS, '300'}
    # --- secrets: LLM provider keys ---
    OPENAI_API_KEY: ${env:OPENAI_API_KEY, ''}
    XAI_API_KEY: ${env:XAI_API_KEY, ''}
    # --- secrets: Web search ---
    TAVILY_API_KEY: ${env:TAVILY_API_KEY, ''}
    # --- vars: LLM / Image ---
    LLM_MODEL: ${env:LLM_MODEL, 'gpt-4o-mini'}
    LLM_PROVIDER: ${env:LLM_PROVIDER, 'openai'}
    IMAGE_MODEL: ${env:IMAGE_MODEL, 'gpt-image-1'}
    IMAGE_PROVIDER: ${env:IMAGE_PROVIDER, 'openai'}
    # Per-slash-command image model overrides. /img-gpt uses IMAGE_MODEL_GPT
    # with the OpenAI provider; /img-xai uses IMAGE_MODEL_XAI with the xAI
    # provider. These are independent of IMAGE_PROVIDER/IMAGE_MODEL above so
    # operators can pin the slash-command models without changing the agent
    # default.
    IMAGE_MODEL_GPT: ${env:IMAGE_MODEL_GPT, 'gpt-image-1'}
    IMAGE_MODEL_XAI: ${env:IMAGE_MODEL_XAI, 'grok-imagine-image'}
    # --- vars: Agent behavior ---
    AGENT_MAX_STEPS: ${env:AGENT_MAX_STEPS, '6'}
    MAX_OUTPUT_TOKENS: ${env:MAX_OUTPUT_TOKENS, '4096'}
    RESPONSE_LANGUAGE: ${env:RESPONSE_LANGUAGE, 'ko'}
    # --- vars: Slack UX ---
    BOT_CURSOR: ${env:BOT_CURSOR, ':robot_face:'}
    MAX_LEN_SLACK: ${env:MAX_LEN_SLACK, '3000'}
    SYSTEM_MESSAGE: ${env:SYSTEM_MESSAGE, ''}
    PERSONA_MESSAGE: ${env:PERSONA_MESSAGE, ''}
    # --- vars: Access control / throttle ---
    ALLOWED_CHANNEL_IDS: ${env:ALLOWED_CHANNEL_IDS, ''}
    ALLOWED_CHANNEL_MESSAGE: ${env:ALLOWED_CHANNEL_MESSAGE, ''}
    ALLOWED_USER_IDS: ${env:ALLOWED_USER_IDS, ''}
    ALLOWED_USER_MESSAGE: ${env:ALLOWED_USER_MESSAGE, ''}
    MAX_THROTTLE_COUNT: ${env:MAX_THROTTLE_COUNT, '100'}
    # --- vars: Storage ---
    MAX_HISTORY_CHARS: ${env:MAX_HISTORY_CHARS, '4000'}
    # --- vars: Observability ---
    LOG_LEVEL: ${env:LOG_LEVEL, 'INFO'}
    # --- vars: Document / time ---
    DEFAULT_TIMEZONE: ${env:DEFAULT_TIMEZONE, 'Asia/Seoul'}
    MAX_DOC_BYTES: ${env:MAX_DOC_BYTES, '26214400'}
    MAX_DOC_CHARS: ${env:MAX_DOC_CHARS, '20000'}
    MAX_DOC_PAGES: ${env:MAX_DOC_PAGES, '50'}
    # --- vars: Web fetch ---
    JINA_READER_BASE: ${env:JINA_READER_BASE, 'https://r.jina.ai'}
    MAX_WEB_BYTES: ${env:MAX_WEB_BYTES, '2097152'}
    MAX_WEB_CHARS: ${env:MAX_WEB_CHARS, '8000'}
    MAX_WEB_LINKS: ${env:MAX_WEB_LINKS, '20'}
    # --- vars: External image attach (attach_image_from_url) ---
    MAX_IMAGE_BYTES: ${env:MAX_IMAGE_BYTES, '10485760'}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            # GetItem/PutItem/Query  — dedup reservations + conversation history
            # UpdateItem             — AppMetadataStore.record() uses
            #   update_item(if_not_exists, ReturnValues=ALL_NEW) so per-app
            #   ACL is read on the same roundtrip as the metadata write.
            # DeleteItem             — MemoryStore.delete() removes the
            #   `mem:{user_id}` row when the user clears their last
            #   memory entry via the `forget` tool. Without this,
            #   clearing the final key would AccessDenied in production.
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
          Resource:
            - !GetAtt ConversationTable.Arn
            - !Join ["", [!GetAtt ConversationTable.Arn, "/index/user-index"]]
        - Effect: Allow
          Action:
            - bedrock:InvokeModel
            - bedrock:InvokeModelWithResponseStream
            - bedrock:Converse
            - bedrock:ConverseStream
          Resource: "*"
        # Self-invoke (async) so the receiver path can fire-and-forget a
        # worker invocation and return HTTP 200 to API Gateway / Slack
        # within a few hundred ms. Scoped to this function's own ARN.
        - Effect: Allow
          Action:
            - lambda:InvokeFunction
          Resource:
            - !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:service}-${sls:stage}-mention"
        # Per-app Slack credentials in SSM Parameter Store. Resource arn
        # uses the parameter NAME path (with leading slash). The wildcard
        # matches both `/gurumi-bot/apps/{app_id}/signing_secret` and
        # `/.../bot_token`. KMS perms are not needed when the parameters
        # use the default `alias/aws/ssm` key — SSM handles decryption
        # transparently. If the operator switches to a CMK they must add
        # an explicit `kms:Decrypt` allow on that key here.
        - Effect: Allow
          Action:
            - ssm:GetParameter
            - ssm:GetParameters
          Resource:
            - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/gurumi-bot/apps/*"

plugins:
  - serverless-python-requirements

custom:
  pythonRequirements:
    slim: true
    layer: false
    noDeploy:
      - pytest
      - pytest-cov
      - moto
      - responses

functions:
  mention:
    handler: app.lambda_handler
    events:
      - http:
          path: slack/events
          method: post
      # Slash Commands (`/img-gpt`, `/img-xai`) share the same Lambda function
      # but arrive as application/x-www-form-urlencoded instead of JSON. The
      # handler routes by `event.path`; Bolt verifies the signing_secret on
      # both paths the same way.
      - http:
          path: slack/command
          method: post

resources:
  Resources:
    ConversationTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${sls:stage}
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: user
            AttributeType: S
          - AttributeName: expire_at
            AttributeType: N
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: user-index
            KeySchema:
              - AttributeName: user
                KeyType: HASH
              - AttributeName: expire_at
                KeyType: RANGE
            Projection:
              ProjectionType: KEYS_ONLY
            ProvisionedThroughput:
              ReadCapacityUnits: 5
              WriteCapacityUnits: 5
        TimeToLiveSpecification:
          AttributeName: expire_at
          Enabled: true
        ProvisionedThroughput:
          ReadCapacityUnits: 5
          WriteCapacityUnits: 5
